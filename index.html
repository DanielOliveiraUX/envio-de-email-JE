<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>Disparador de Emails · Leilão</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117; color: #e2e8f0;
    font-family: 'DM Sans', sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .box {
    background: #181c27; border: 1px solid #2a3047; border-radius: 20px;
    padding: 48px 52px; text-align: center; max-width: 460px; width: 90%;
  }
  .icon { font-size: 52px; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }

  /* Spinner */
  .spinner-wrap { margin: 24px auto; width: 52px; height: 52px; }
  .spinner {
    width: 52px; height: 52px;
    border: 3px solid #2a3047; border-top-color: #4f8ef7;
    border-radius: 50%; animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-bg {
    background: #1e2333; border-radius: 100px;
    height: 6px; overflow: hidden; margin-bottom: 12px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4f8ef7, #34d399);
    border-radius: 100px; width: 0%; transition: width .4s ease;
  }
  .status { font-size: 13px; color: #94a3b8; margin-bottom: 24px; min-height: 20px; }

  .steps { text-align: left; margin-bottom: 28px; display: flex; flex-direction: column; gap: 10px; }
  .step-row { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #64748b; transition: color .3s; }
  .step-row.done   { color: #34d399; }
  .step-row.active { color: #e2e8f0; }
  .step-dot {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: #1e2333; border: 1.5px solid #374060;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; transition: all .3s;
  }
  .step-row.done   .step-dot { background: #34d399; border-color: #34d399; color: #fff; }
  .step-row.active .step-dot { background: #4f8ef7; border-color: #4f8ef7; color: #fff; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 28px; background: #4f8ef7; color: #fff;
    border: none; border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
    cursor: pointer; text-decoration: none; transition: background .15s;
    opacity: 0; pointer-events: none; transform: translateY(6px);
    transition: opacity .4s ease, transform .4s ease, background .15s;
  }
  .btn.visible { opacity: 1; pointer-events: all; transform: translateY(0); }
  .btn:hover { background: #6fa8ff; }

  .erro {
    display: none; background: rgba(248,113,113,.08);
    border: 1px solid rgba(248,113,113,.2); border-radius: 10px;
    padding: 14px 18px; font-size: 13px; color: #f87171;
    text-align: left; margin-top: 16px; line-height: 1.6;
  }
  .erro.show { display: block; }
  code { font-family: monospace; background: #1e2333; padding: 2px 7px; border-radius: 4px; color: #4f8ef7; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">📨</div>
  <h1>Disparador de Emails</h1>

  <div class="spinner-wrap"><div class="spinner" id="spinner"></div></div>
  <div class="progress-bg"><div class="progress-fill" id="bar"></div></div>
  <div class="status" id="status">Iniciando servidor...</div>

  <div class="steps">
    <div class="step-row active" id="s1">
      <div class="step-dot" id="sd1">1</div><span>Iniciando servidor Flask</span>
    </div>
    <div class="step-row" id="s2">
      <div class="step-dot" id="sd2">2</div><span>Instalando dependências</span>
    </div>
    <div class="step-row" id="s3">
      <div class="step-dot" id="sd3">3</div><span>Servidor pronto</span>
    </div>
  </div>

  <a href="http://localhost:5000" class="btn" id="btnAbrir">🚀 Abrir Interface</a>

  <div class="erro" id="erroBox">
    <strong>Servidor não respondeu.</strong><br><br>
    Abra a pasta <code>Projeto</code> e dê duplo clique em <code>iniciar.bat</code>.<br>
    Depois clique em <a href="http://localhost:5000" style="color:#4f8ef7">Abrir Interface</a>.
  </div>
</div>

<script>
// Tenta disparar o iniciar.vbs automaticamente
try {
  var s = new ActiveXObject('WScript.Shell');
  var base = location.pathname.replace(/\/[^\/]*$/, '').replace(/\//g,'\\').replace(/^\\/,'');
  s.CurrentDirectory = base + '\\Projeto';
  s.Run('cmd /c cd /d "' + base + '\\Projeto" && pip install -r requirements.txt -q && python app.py', 0, false);
} catch(e) { /* navegador moderno — o vbs será acionado pelo polling fallback */ }

var tentativas = 0, MAX = 35, timer = null;

function setStep(n) {
  ['s1','s2','s3'].forEach(function(id, i) {
    var el = document.getElementById(id);
    var dot = document.getElementById('sd' + (i+1));
    el.className = 'step-row' + (i+1 < n ? ' done' : i+1 === n ? ' active' : '');
    dot.innerHTML = i+1 < n ? '✓' : i+1;
  });
}

function poll() {
  tentativas++;
  document.getElementById('bar').style.width = Math.min((tentativas/MAX)*90, 90) + '%';
  if (tentativas === 1)  { setStep(1); document.getElementById('status').innerText = 'Iniciando servidor Flask...'; }
  if (tentativas === 5)  { setStep(2); document.getElementById('status').innerText = 'Instalando dependências Python...'; }
  if (tentativas === 12) { document.getElementById('status').innerText = 'Aguardando servidor responder...'; }

  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'http://localhost:5000/api/auth-status', true);
  xhr.timeout = 1500;
  xhr.onload = function() {
    if (xhr.status === 200) {
      setStep(3);
      document.getElementById('bar').style.width = '100%';
      document.getElementById('status').innerText = 'Servidor pronto! Abrindo...';
      document.getElementById('spinner').style.borderTopColor = '#34d399';
      document.getElementById('btnAbrir').className = 'btn visible';
      setTimeout(function() { window.location.href = 'http://localhost:5000'; }, 1000);
    } else { retry(); }
  };
  xhr.onerror   = function() { retry(); };
  xhr.ontimeout = function() { retry(); };
  xhr.send();
}

function retry() {
  if (tentativas >= MAX) {
    document.getElementById('status').innerText = 'Não foi possível conectar automaticamente.';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('erroBox').className = 'erro show';
    return;
  }
  timer = setTimeout(poll, 1500);
}

setTimeout(poll, 1500);
</script>
</body>
</html>
